<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>تيك برو TechPro - الصفحة الرئيسية</title>
  
  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind-config.js"></script>
  
  <!-- CSS -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/main.css">
</head>
<body class="bg-background font-sans text-on-surface antialiased min-h-screen flex flex-col">

  <!-- Header Container -->
  <div id="header-container"></div>

  <!-- Main Content -->
  <main class="w-full pt-36 lg:pt-40 bg-background min-h-[calc(100vh-280px)] flex-grow mt-space-lg">
    
    <!-- Value Propositions Section -->
    <section class="w-full bg-surface-container-low py-space-sm px-space-md lg:px-space-xl border-b border-outline-variant/10 text-xs">
      <div class="max-w-7xl mx-auto grid grid-cols-2 lg:grid-cols-4 gap-space-sm lg:gap-space-md">
        <div class="flex items-center gap-2 p-3 rounded-xl bg-surface-container-lowest shadow-sm border border-outline-variant/10">
          <div class="w-10 h-10 rounded-full bg-primary-container/10 flex items-center justify-center shrink-0 text-primary-container">
            <span class="material-symbols-outlined text-xl" aria-hidden="true">bolt</span>
          </div>
          <div class="flex flex-col">
            <span class="font-bold text-on-surface" data-i18n="value_fast_shipping_title">شحن سريع 24 ساعة</span>
            <span class="text-secondary text-[11px]" data-i18n="value_fast_shipping_desc">توصيل آمن لجميع مدن المملكة</span>
          </div>
        </div>

        <div class="flex items-center gap-2 p-3 rounded-xl bg-surface-container-lowest shadow-sm border border-outline-variant/10">
          <div class="w-10 h-10 rounded-full bg-tertiary-container/15 flex items-center justify-center shrink-0 text-tertiary">
            <span class="material-symbols-outlined text-xl" aria-hidden="true">verified</span>
          </div>
          <div class="flex flex-col">
            <span class="font-bold text-on-surface" data-i18n="value_warranty_title">ضمان ذهبي معتمد</span>
            <span class="text-secondary text-[11px]" data-i18n="value_warranty_desc">سنتان للجديد و 6 أشهر للمستعمل</span>
          </div>
        </div>

        <div class="flex items-center gap-2 p-3 rounded-xl bg-surface-container-lowest shadow-sm border border-outline-variant/10">
          <div class="w-10 h-10 rounded-full bg-primary/10 flex items-center justify-center shrink-0 text-primary">
            <span class="material-symbols-outlined text-xl" aria-hidden="true">published_with_changes</span>
          </div>
          <div class="flex flex-col">
            <span class="font-bold text-on-surface" data-i18n="value_inspection_title">فحص تقني 40 نقطة</span>
            <span class="text-secondary text-[11px]" data-i18n="value_inspection_desc">اعتماد هندسي للأجهزة المجددة</span>
          </div>
        </div>

        <div class="flex items-center gap-2 p-3 rounded-xl bg-surface-container-lowest shadow-sm border border-outline-variant/10">
          <div class="w-10 h-10 rounded-full bg-secondary-container flex items-center justify-center shrink-0 text-on-secondary-fixed">
            <span class="material-symbols-outlined text-xl" aria-hidden="true">credit_card</span>
          </div>
          <div class="flex flex-col">
            <span class="font-bold text-on-surface" data-i18n="value_installment_title">تقسيط تابي وتمارا</span>
            <span class="text-secondary text-[11px]" data-i18n="value_installment_desc">قسّم فاتورتك بدون فوائد</span>
          </div>
        </div>
      </div>
    </section>
    
    <!-- Main Page Content -->
    <div class="max-w-7xl mx-auto px-space-md lg:px-space-xl py-space-2xl">
      <h1 class="text-2xl font-bold text-on-surface mb-4" data-i18n="main_title">محتوى الصفحة الرئيسية</h1>
      <p class="text-secondary" data-i18n="main_desc">الهيدر والفوتر يتم تحميلهم ديناميكياً! ✅</p>
      
      <!-- أزرار تجريبية للسلة والمفضلة -->
      <div class="mt-8 space-y-4">
        <button onclick="addToCart(150)" class="px-6 py-3 bg-primary-container text-on-primary font-bold rounded-lg hover:bg-primary transition-colors" data-i18n="btn_add_cart">
          إضافة منتج للسلة (150 ر.ع.)
        </button>
        <button onclick="addToWishlist()" class="px-6 py-3 bg-tertiary-container text-on-tertiary font-bold rounded-lg hover:bg-tertiary transition-colors" data-i18n="btn_add_wishlist">
          إضافة للمفضلة
        </button>
        <button onclick="clearCart()" class="px-6 py-3 bg-error text-on-error font-bold rounded-lg hover:bg-error/90 transition-colors" data-i18n="btn_clear_cart">
          إفراغ السلة
        </button>
      </div>
    </div>
  </main>

  <!-- Footer Container -->
  <div id="footer-container"></div>

  <!-- JavaScript -->
  <script src="js/i18n.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
