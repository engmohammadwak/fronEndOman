<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>تيك برو TechPro - الصفحة الرئيسية</title>
  
  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind-config.js"></script>
  
  <!-- CSS -->
  <link rel="stylesheet" href="css/variables.css">
</head>
<body class="bg-background font-sans text-on-surface antialiased min-h-screen">

  <!-- Header Component -->
  <div id="header-container"></div>
  <script>
    fetch('components/header.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('header-container').innerHTML = data;
      });
  </script>

  <!-- Main Content -->
  <main class="w-full pt-36 lg:pt-40 bg-background min-h-[calc(100vh-280px)]">
    <div class="max-w-7xl mx-auto px-space-md lg:px-space-xl py-space-2xl">
      <h1 class="text-2xl font-bold text-on-surface mb-4">محتوى الصفحة الرئيسية</h1>
      <p class="text-secondary">الهيدر شغال! ✅</p>
    </div>
  </main>

</body>
</html>
