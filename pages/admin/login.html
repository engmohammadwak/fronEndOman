<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بوابة الإدارة المركزية | TechPro</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/admin-login.css?v=login-2">
</head>
<body>

  <div class="ambient-background" aria-hidden="true">
    <div class="ambient-blob blob-1"></div>
    <div class="ambient-blob blob-2"></div>
  </div>

  <main class="login-container">

    <header class="brand-header">
      <div class="brand-title-wrap">
        <div class="brand-icon">
          <img data-brand-logo class="brand-logo-img" src="/assets/images/brand-mark.svg" alt="">
        </div>
        <h1 class="brand-name" data-brand-name>تيك برو TechPro</h1>
      </div>
      <p class="brand-sub">نظام إدارة العمليات، التجارة وقنوات التوزيع</p>
    </header>

    <section class="card">
      <h2 class="card-title">تسجيل الدخول الإداري</h2>
      <p class="card-desc">أدخل بيانات الاعتماد للمتابعة إلى لوحة التحكم</p>

      <form id="admin-login-form">

        <div class="form-group">
          <label class="form-label" for="admin-email">اسم المستخدم أو البريد الإلكتروني</label>
          <div class="input-wrapper">
            <span class="material-symbols-outlined input-icon-right">person</span>
            <input
              id="admin-email"
              name="email"
              type="text"
              required
              autocomplete="username"
              placeholder="أدخل اسم المستخدم أو البريد"
              class="input-field"
            >
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="admin-password">كلمة المرور</label>
          <div class="input-wrapper">
            <span class="material-symbols-outlined input-icon-right">lock</span>
            <input
              id="admin-password"
              name="password"
              type="password"
              required
              autocomplete="current-password"
              placeholder="••••••••••••"
              class="input-field input-field-pwd"
            >
            <button
              type="button"
              id="toggle-pwd-btn"
              aria-label="إظهار أو إخفاء كلمة المرور"
              class="btn-toggle-pwd"
            >
              <span class="material-symbols-outlined" id="pwd-icon">visibility</span>
            </button>
          </div>
          <span class="input-hint">أدخل كلمة المرور كما هي</span>
        </div>

        <div class="form-options-row">
          <label class="remember-wrap">
            <input id="remember-session" name="remember" type="checkbox">
            <span>تذكر بيانات الدخول</span>
          </label>
          <a href="#" class="forgot-link">نسيت كلمة المرور؟</a>
        </div>

        <button type="submit" id="login-submit-btn" class="btn-submit">
          <span class="material-symbols-outlined">login</span>
          <span>تسجيل الدخول</span>
        </button>
        <p id="login-error" role="alert" hidden></p>
      </form>
    </section>

  </main>

  <script src="/js/ui-dialog.js?v=dialog-2"></script>
  <script src="/js/admin/store-state.js?v=brand-2"></script>
  <script src="/js/admin/admin-login.js?v=dash-2"></script>
  <script>
    try {
      if (window.StoreState) {
        StoreState.ensure();
        StoreState.applyDocumentBranding({
          admin: true,
          lang: 'ar',
          titleSuffix: 'بوابة الإدارة'
        });
      }
    } catch (e) {}
  </script>

</body>
</html>
