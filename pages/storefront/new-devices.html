<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>تيك برو TechPro - الأجهزة الجديدة</title>

  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../../js/tailwind-config.js"></script>

  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/main.css">
</head>
<body
  class="bg-background font-sans text-on-surface min-h-screen flex flex-col"
  data-active-nav="new-devices"
  data-header-path="../../components/header.html"
  data-footer-path="../../components/footer.html"
>
  <div id="header-container"></div>

  <main class="w-full pt-36 lg:pt-40 bg-background min-h-[calc(100vh-280px)]">
    <div class="flex flex-col w-full text-on-surface">
      
      <!-- Top Sub-Header & Breadcrumb -->
      <section class="w-full bg-surface-container-low px-space-md lg:px-space-xl py-space-lg shadow-sm border-b border-outline-variant/10 text-xs">
        <div class="max-w-7xl mx-auto flex flex-col gap-space-md">
          <nav aria-label="مسار التنقل" class="flex items-center gap-1 text-secondary font-bold">
            <a class="hover:text-primary transition-colors flex items-center gap-1" href="../../index.html">
              <span class="material-symbols-outlined text-base" aria-hidden="true">home</span>
              <span>الرئيسية</span>
            </a>
            <span class="material-symbols-outlined text-xs rotate-180 text-outline" aria-hidden="true">chevron_right</span>
            <span>الأجهزة الإلكترونية</span>
            <span class="material-symbols-outlined text-xs rotate-180 text-outline" aria-hidden="true">chevron_right</span>
            <span class="text-on-surface">كتالوج الأجهزة والتقنيات</span>
          </nav>

          <div class="flex flex-col md:flex-row md:items-center justify-between gap-space-md">
            <div class="flex flex-col gap-1">
              <div class="flex items-center gap-2 flex-wrap">
                <h1 id="page-title" class="text-xl lg:text-2xl font-black text-on-surface tracking-tight"></h1>
                <span class="bg-primary/10 text-primary px-3 py-1 rounded-full font-bold"><span id="catalog-total"></span></span>
              </div>
              <p id="page-description" class="text-secondary leading-relaxed"></p>
            </div>

            <nav class="inline-flex p-1 bg-surface-container rounded-xl shadow-inner gap-1 shrink-0" aria-label="أنواع الأجهزة">
              <a href="new-devices.html" class="px-4 py-2 rounded-lg font-bold bg-surface-container-lowest text-primary shadow-sm" data-i18n="nav_new_devices"></a>
              <a href="refurbished-devices.html" class="px-4 py-2 rounded-lg font-bold text-secondary" data-i18n="nav_refurbished"></a>
            </nav>
          </div>
        </div>
      </section>

      <!-- Interactive Control Bar -->
      <section class="w-full bg-surface-container-lowest px-space-md lg:px-space-xl py-space-md shadow-sm text-xs">
        <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-space-md">
          <div class="relative flex-1 min-w-0 w-full max-w-lg">
            <span class="material-symbols-outlined absolute right-3 top-2.5 text-secondary text-lg" aria-hidden="true">search</span>
            <input id="catalog-search" data-i18n-placeholder="catalog_search" aria-label="ابحث في الكتالوج" class="w-full h-10 pr-9 pl-3 bg-surface-container-low rounded-lg text-on-surface placeholder:text-secondary focus:outline-none border border-outline-variant/20 focus:border-primary transition-all font-mono text-xs" placeholder="ابحث بالاسم، الموديل، السعة، المعالج..." type="text"/>
          </div>

          <div class="flex items-center gap-3 flex-wrap font-bold">
            <div class="flex items-center gap-1">
              <label for="sort-select" class="text-secondary" data-i18n="catalog_sort">الترتيب حسب:</label>
              <select id="sort-select" aria-label="ترتيب النتائج" class="h-10 bg-surface-container-low text-on-surface px-3 rounded-lg border border-outline-variant/20 focus:outline-none cursor-pointer font-bold">
                <option value="latest">الأحدث وصولاً وتوفراً</option>
                <option value="price-low">السعر: من الأقل للأعلى</option>
                <option value="price-high">السعر: من الأعلى للأقل</option>
                <option value="rating">الأعلى تقييماً</option>
              </select>
            </div>
          </div>
        </div>
      </section>

      <!-- Main Catalog Space -->
      <div class="max-w-7xl mx-auto px-space-md lg:px-space-xl py-space-xl w-full text-xs">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-space-lg items-start">
          
          <!-- Sidebar Filters (3 Cols) -->
          <aside id="filters-container" class="flex flex-col lg:col-span-3 gap-space-md lg:sticky lg:top-44"></aside>

          <!-- Products Grid (9 Cols) -->
          <section class="lg:col-span-9 min-w-0 flex flex-col gap-space-lg">
            <div id="demo-data-notice" class="hidden rounded-lg bg-primary/10 text-primary p-3 text-xs" data-i18n="demo_data_notice"></div>
            <div class="bg-surface-container-lowest p-3 rounded-xl shadow-sm border border-outline-variant/10 flex flex-wrap gap-2 items-center justify-between text-xs font-semibold">
              <div id="applied-filters" class="flex items-center gap-1.5 flex-wrap"></div>
              <span id="products-count" class="text-secondary font-mono" aria-live="polite"></span>
            </div>
            <div id="products-grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-space-md"></div>
            <div class="flex justify-center"><button id="load-more-button" type="button" class="px-6 py-3 rounded-lg bg-primary text-on-primary font-bold" data-i18n="load_more"></button></div>
          </section>
        </div>
      </div>
    </div>
  </main>

  <div id="footer-container"></div>

  <script src="../../js/i18n.js"></script>
  <script src="../../js/toast.js"></script>
  <script src="../../js/main.js"></script>
  <script src="../../js/pages/storefront-common.js"></script>
  <script src="../../js/pages/catalog-layout.js"></script>
  <script src="../../js/pages/new-devices.js"></script>
</body>
</html>
