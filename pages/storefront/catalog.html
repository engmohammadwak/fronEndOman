<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>تيك برو TechPro - كتالوج الأجهزة</title>

  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../../css/generated.css?v=session-2">

  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/main.css">
  <link rel="stylesheet" href="../../css/catalog.css?v=catalog-search-2">
</head>
<body
  class="catalog-page bg-background font-sans text-on-surface antialiased min-h-screen flex flex-col"
  data-active-nav=""
  data-header-path="../../components/header.html"
  data-footer-path="../../components/footer.html"
>
  <div id="header-container"></div>

  <main class="w-full bg-background min-h-[calc(100vh-280px)] flex-grow">
    <section class="catalog-hero">
      <div class="max-w-7xl mx-auto px-space-md lg:px-space-xl py-5">
        <nav aria-label="مسار التنقل" class="flex flex-wrap items-center gap-1 text-secondary text-xs font-bold">
          <a class="hover:text-primary transition-colors flex items-center gap-1" href="../../index.html">
            <span class="material-symbols-outlined text-base" aria-hidden="true">home</span>
            <span data-i18n="nav_home">الرئيسية</span>
          </a>
          <span class="material-symbols-outlined text-xs rotate-180 text-outline" aria-hidden="true">chevron_right</span>
          <span data-i18n="catalog_electronics">الأجهزة الإلكترونية</span>
          <span class="material-symbols-outlined text-xs rotate-180 text-outline" aria-hidden="true">chevron_right</span>
          <span class="text-on-surface" data-i18n="catalog_page_title" aria-current="page">كتالوج الأجهزة</span>
        </nav>

        <div class="flex flex-col lg:flex-row lg:items-end justify-between gap-3 mt-3">
          <div>
            <div class="flex items-center gap-3 flex-wrap">
              <span class="w-2.5 h-7 bg-primary-container rounded-full" aria-hidden="true"></span>
              <h1 id="page-title" class="text-2xl lg:text-3xl font-black text-on-surface tracking-tight">كتالوج الأجهزة</h1>
              <span id="catalog-total" class="catalog-count-pill"></span>
            </div>
            <p id="page-description" class="text-secondary leading-relaxed mt-1.5 max-w-2xl text-sm">ابحث في كل الأجهزة الجديدة والمجددة من مكان واحد.</p>
          </div>
        </div>

        <div id="condition-tabs" class="catalog-tabs mt-4" role="tablist" aria-label="حالة الجهاز"></div>

        <div class="catalog-toolbar flex flex-wrap items-center justify-between gap-3">
          <div class="catalog-search relative flex-1 min-w-0 w-full max-w-lg">
            <span class="material-symbols-outlined absolute top-1/2 -translate-y-1/2 text-secondary text-lg" aria-hidden="true">search</span>
            <input id="catalog-search" data-i18n-placeholder="catalog_search" aria-label="ابحث في الكتالوج" class="w-full h-11 bg-surface-container-low rounded-xl text-on-surface placeholder:text-secondary focus:outline-none border border-outline-variant/20 focus:border-primary transition-all text-sm" placeholder="ابحث بالاسم أو الماركة أو السعة..." type="search" autocomplete="off"/>
          </div>

          <div class="flex items-center gap-2 flex-wrap font-bold text-sm">
            <label for="sort-select" class="text-secondary text-xs" data-i18n="catalog_sort">الترتيب</label>
            <select id="sort-select" aria-label="ترتيب النتائج" class="h-11 bg-surface-container-low text-on-surface px-3 rounded-xl border border-outline-variant/20 focus:outline-none cursor-pointer font-bold text-sm">
              <option value="latest">الأحدث</option>
              <option value="price-low">السعر: من الأقل للأعلى</option>
              <option value="price-high">السعر: من الأعلى للأقل</option>
              <option value="rating">الأعلى تقييماً</option>
            </select>
            <div class="catalog-view-toggle" role="group" aria-label="طريقة العرض">
              <button id="view-grid" type="button" aria-pressed="true" aria-label="عرض شبكي">
                <span class="material-symbols-outlined text-lg" aria-hidden="true">grid_view</span>
              </button>
              <button id="view-list" type="button" aria-pressed="false" aria-label="عرض قائمة">
                <span class="material-symbols-outlined text-lg" aria-hidden="true">view_list</span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <div class="max-w-7xl mx-auto px-space-md lg:px-space-xl py-6 w-full">
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-space-lg items-start">
        <aside id="filters-container" class="flex flex-col lg:col-span-3 gap-space-md lg:sticky"></aside>

        <section class="lg:col-span-9 min-w-0 flex flex-col gap-space-lg">
          <div id="demo-data-notice" class="catalog-demo hidden" data-i18n="demo_data_notice"></div>
          <div class="catalog-meta">
            <div id="applied-filters" class="flex items-center gap-1.5 flex-wrap"></div>
            <span id="products-count" class="text-xs font-bold" aria-live="polite"></span>
          </div>
          <div id="products-grid" class="catalog-grid grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-space-md"></div>
          <div id="catalog-empty" class="catalog-empty" hidden></div>
        </section>
      </div>
    </div>
  </main>

  <div id="footer-container"></div>

  <script src="../../js/i18n.js?v=session-2"></script>
  <script src="../../js/toast.js?v=session-2"></script>
  <script src="../../js/config.js?v=session-2"></script>
  <script src="../../js/api.js?v=session-2"></script>
  <script src="../../js/main.js?v=session-2"></script>
  <script src="../../js/auth-state.js?v=session-2"></script>
  <script src="../../js/pages/storefront-common.js?v=session-2"></script>
  <script src="../../js/pages/storefront-demo-catalog.js?v=session-2"></script>
  <script src="../../js/admin/store-state.js?v=admin-1"></script>
  <script src="../../js/storefront-bridge.js?v=admin-1"></script>
  <script src="../../js/pages/catalog-layout.js?v=session-2"></script>
  <script src="../../js/pages/catalog.js?v=session-2"></script>
</body>
</html>
