<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بوابة الإدارة المركزية | TechPro</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-light: rgba(79, 70, 229, 0.08);
      --success: #10b981;
      --success-light: rgba(16, 185, 129, 0.08);
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --text-placeholder: #94a3b8;
      --border: #e2e8f0;
      --border-focus: #4f46e5;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --shadow-card: 0 10px 25px -5px rgba(15, 23, 42, 0.06), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
      --transition: all 0.2s ease-in-out;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem 1rem;
      position: relative;
      overflow-x: hidden;
    }

    .ambient-blob {
      position: absolute;
      width: 26rem;
      height: 26rem;
      border-radius: 50%;
      filter: blur(90px);
      pointer-events: none;
      z-index: -1;
    }
    .blob-1 {
      top: -8rem;
      right: -8rem;
      background-color: var(--primary-light);
    }
    .blob-2 {
      bottom: -8rem;
      left: -8rem;
      background-color: var(--success-light);
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .brand-header {
      text-align: center;
      margin-bottom: 1.75rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .brand-title-wrap {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 0.25rem;
    }
    .brand-icon {
      width: 44px;
      height: 44px;
      background-color: var(--primary);
      color: #fff;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
    }
    .brand-name {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .brand-name span {
      color: var(--primary);
      font-weight: 800;
    }
    .brand-sub {
      font-size: 0.825rem;
      color: var(--text-muted);
    }

    .card {
      width: 100%;
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 2.25rem 2rem;
      box-shadow: var(--shadow-card);
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: 700;
      text-align: center;
    }
    .card-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-align: center;
      margin-top: 0.35rem;
      margin-bottom: 1.5rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      margin-bottom: 1.15rem;
      text-align: right;
    }
    .form-label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-field {
      width: 100%;
      height: 44px;
      background-color: #f8fafc;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 0.9rem;
      color: var(--text-main);
      padding: 0 2.6rem 0 0.85rem;
      outline: none;
      transition: var(--transition);
    }
    .input-field::placeholder {
      color: var(--text-placeholder);
    }
    .input-field:focus {
      background-color: #ffffff;
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
    }

    /* حقل كلمة المرور بالإنجليزية فقط ومحاذاته */
    .input-field-pwd {
      direction: ltr !important;
      text-align: left;
      padding: 0 2.6rem 0 2.6rem !important;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      letter-spacing: 0.05em;
    }
    .input-field-pwd::placeholder {
      font-family: 'Cairo', sans-serif;
      letter-spacing: normal;
      text-align: right;
      direction: rtl;
    }

    .input-icon-right {
      position: absolute;
      right: 0.8rem;
      color: var(--text-placeholder);
      pointer-events: none;
      font-size: 1.25rem;
      display: flex;
    }

    .btn-toggle-pwd {
      position: absolute;
      left: 0.6rem;
      background: none;
      border: none;
      color: var(--text-placeholder);
      cursor: pointer;
      display: flex;
      padding: 0.25rem;
      border-radius: 4px;
      transition: var(--transition);
    }
    .btn-toggle-pwd:hover {
      color: var(--text-main);
    }

    .input-hint {
      font-size: 0.725rem;
      color: var(--text-muted);
      margin-top: 0.2rem;
    }

    /* السطر التفاعلي تحت كلمة المرور (تذكرني + نسيت كلمة المرور) */
    .form-options-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 0.25rem;
      margin-bottom: 1.5rem;
    }
    .remember-wrap {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      cursor: pointer;
      font-size: 0.825rem;
      color: var(--text-muted);
      user-select: none;
    }
    .remember-wrap input {
      width: 15px;
      height: 15px;
      accent-color: var(--primary);
      cursor: pointer;
    }
    .forgot-link {
      font-size: 0.8rem;
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: var(--transition);
    }
    .forgot-link:hover {
      color: var(--primary-hover);
      text-decoration: underline;
    }

    .btn-submit {
      width: 100%;
      height: 44px;
      background-color: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.2);
      transition: var(--transition);
    }
    .btn-submit:hover {
      background-color: var(--primary-hover);
    }
    .btn-submit:active {
      transform: scale(0.99);
    }
    .btn-submit:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }
    .btn-submit.btn-success {
      background-color: var(--success);
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
    }

    .spinner {
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @media (max-width: 480px) {
      .card {
        padding: 1.75rem 1.25rem;
      }
    }
  </style>
</head>
<body>

  <div class="ambient-blob blob-1"></div>
  <div class="ambient-blob blob-2"></div>

  <main class="login-container">
    
    <header class="brand-header">
      <div class="brand-title-wrap">
        <div class="brand-icon">
          <span class="material-symbols-outlined">admin_panel_settings</span>
        </div>
        <h1 class="brand-name">تيك برو <span>TechPro</span></h1>
      </div>
      <p class="brand-sub">نظام إدارة العمليات، التجارة وقنوات التوزيع</p>
    </header>

    <section class="card">
      <h2 class="card-title">تسجيل الدخول الإداري</h2>
      <p class="card-desc">أدخل بيانات الاعتماد للمتابعة إلى لوحة التحكم</p>

      <form id="admin-login-form" onsubmit="event.preventDefault(); handleLoginSubmit();">
        
        <!-- حقل اسم المستخدم -->
        <div class="form-group">
          <label class="form-label" for="admin-email">اسم المستخدم أو البريد الإلكتروني</label>
          <div class="input-wrapper">
            <span class="material-symbols-outlined input-icon-right">person</span>
            <input 
              id="admin-email" 
              name="email" 
              type="text" 
              required 
              autocomplete="username" 
              placeholder="أدخل اسم المستخدم أو البريد" 
              class="input-field"
            >
          </div>
        </div>

        <!-- حقل كلمة المرور -->
        <div class="form-group">
          <label class="form-label" for="admin-password">كلمة المرور</label>
          <div class="input-wrapper">
            <span class="material-symbols-outlined input-icon-right">lock</span>
            <input 
              id="admin-password" 
              name="password" 
              type="password" 
              required 
              autocomplete="current-password" 
              placeholder="••••••••••••" 
              class="input-field input-field-pwd"
              oninput="filterArabic(this)"
              onpaste="handlePaste(event)"
            >
            <button 
              type="button" 
              id="toggle-pwd-btn" 
              onclick="togglePasswordVisibility()" 
              aria-label="إظهار أو إخفاء كلمة المرور" 
              class="btn-toggle-pwd"
            >
              <span class="material-symbols-outlined" id="pwd-icon">visibility</span>
            </button>
          </div>
          <span class="input-hint">الأحرف والأرقام والرموز الإنجليزية فقط</span>
        </div>

        <!-- خيارات إضافية: تذكرني + نسيت كلمة المرور (أسفل الحقل) -->
        <div class="form-options-row">
          <label class="remember-wrap">
            <input id="remember-session" name="remember" type="checkbox">
            <span>تذكر بيانات الدخول</span>
          </label>
          <a href="#" class="forgot-link">نسيت كلمة المرور؟</a>
        </div>

        <!-- زر الإرسال -->
        <button type="submit" id="login-submit-btn" class="btn-submit">
          <span class="material-symbols-outlined">login</span>
          <span>تسجيل الدخول</span>
        </button>
      </form>
    </section>

  </main>

  <script>
    // حظر ومنع الحروف العربية والرموز غير اللاتينية نهائياً
    function filterArabic(input) {
      // إزالة أي محرف ينتمي للمجال العربي فور كتابته
      input.value = input.value.replace(/[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF\uFB50-\uFDFF\uFE70-\uFEFF]/g, '');
    }

    // منع اللصق إذا كان يحتوي على أحرف عربية
    function handlePaste(event) {
      const pasteData = (event.clipboardData || window.clipboardData).getData('text');
      if (/[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF\uFB50-\uFDFF\uFE70-\uFEFF]/.test(pasteData)) {
        event.preventDefault();
        const cleanedData = pasteData.replace(/[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF\uFB50-\uFDFF\uFE70-\uFEFF]/g, '');
        document.execCommand('insertText', false, cleanedData);
      }
    }

    function togglePasswordVisibility() {
      const pwdInput = document.getElementById('admin-password');
      const icon = document.getElementById('pwd-icon');
      if (!pwdInput || !icon) return;

      const isPassword = pwdInput.type === 'password';
      pwdInput.type = isPassword ? 'text' : 'password';
      icon.textContent = isPassword ? 'visibility_off' : 'visibility';
    }

    function handleLoginSubmit() {
      const btn = document.getElementById('login-submit-btn');
      if (!btn || btn.disabled) return;

      const originalHtml = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = `
        <span class="material-symbols-outlined spinner">progress_activity</span>
        <span>جاري التحقق والمصادقة...</span>
      `;

      setTimeout(() => {
        btn.classList.add('btn-success');
        btn.innerHTML = `
          <span class="material-symbols-outlined">verified_user</span>
          <span>تمت المصادقة - جاري التحويل...</span>
        `;

        setTimeout(() => {
          btn.innerHTML = originalHtml;
          btn.disabled = false;
          btn.classList.remove('btn-success');
        }, 1800);
      }, 1200);
    }
  </script>
</body>
</html>
